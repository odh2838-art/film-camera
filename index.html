<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="필름을 고르고 찍기만 하면 되는 카메라">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 홈 화면 앱: 화면이 상태 표시줄 아래에서 시작하게 한다.
     black-translucent 로 두면 아이폰이 화면 높이를 상태 표시줄만큼 짧게 잡아서
     아래쪽이 잘리고 버튼을 눌러도 손가락 위치가 어긋났다. 바탕이 검정이라 겉보기는 같다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="optikē">
<meta name="application-name" content="optikē">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>optikē</title>
</head>
<body>
<!-- 촬영 화면. 시작 화면이나 결과 화면이 떠 있는 동안은 app.js 가 inert 로 잠근다 -->
<main id="app" inert>
  <div id="view" role="img" aria-label="카메라 화면">
    <canvas id="gl"></canvas>
    <canvas id="stamp" hidden></canvas>
    <div id="flash"></div>
  </div>
  <div id="top">
    <button id="ratio" class="pill glass press" type="button"></button>
  </div>
  <div id="dock">
    <button id="filmBtn" class="pill glass press" type="button" aria-expanded="false" aria-controls="band"></button>
  </div>
  <section id="band" aria-label="필름 고르기">
    <button id="done" class="press" type="button">완료</button>
    <div id="label">
      <div id="filmName"></div>
      <div id="filmWhen"></div>
    </div>
    <div id="amount">
      <div id="amountRow" aria-hidden="true"><span>약하게</span><strong id="amountNum"></strong><span>강하게</span></div>
      <input id="amountInput" type="range" min="0" max="100" step="5" aria-label="필름 강도">
      <canvas id="dial" aria-hidden="true"></canvas>
    </div>
    <div id="filmsWrap">
      <div id="films" role="radiogroup" aria-label="필름"></div>
      <div id="ring" aria-hidden="true"></div>
    </div>
  </section>
  <div id="bar">
    <button class="side press" id="pick" type="button" aria-label="앨범에서 사진 고르기">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></span>
      <span aria-hidden="true">앨범</span>
    </button>
    <button id="shutter" type="button" aria-label="사진 찍기"><span></span></button>
    <button class="side press" id="flip" type="button" aria-label="카메라 앞뒤 바꾸기">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a8 8 0 0114-3l2 2M20 15a8 8 0 01-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></span>
      <span aria-hidden="true">앞뒤 바꾸기</span>
    </button>
    <!-- 앨범 사진을 보고 있을 때는 "앞뒤 바꾸기" 자리에 카메라로 돌아가는 버튼이 온다 -->
    <button class="side press" id="toCam" type="button" aria-label="카메라로 돌아가기" hidden>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span aria-hidden="true">카메라</span>
    </button>
  </div>
</main>

<section id="start" aria-labelledby="title">
  <div class="copy">
    <img id="mark" src="icon.svg" alt="" width="96" height="96">
    <h1 id="title" lang="grc-Latn">optikē</h1>
    <p>필름을 고르고 찍기만 하면 돼요.</p>
  </div>
  <p id="err" role="alert"></p>
  <button class="big primary press" id="go" type="button">카메라 켜기</button>
  <button class="quiet press" id="go2" type="button">앨범 사진으로 해볼게요</button>
</section>

<!-- 안내 문구는 결과 화면 위에도 보이게 맨 위 층에 둔다 -->
<div id="toast" class="glass" role="status"></div>
<!-- 화면에는 안 보이고 화면 읽어 주기(VoiceOver)로만 알리는 말 -->
<div id="live" class="sr" aria-live="polite"></div>

<div id="result" role="dialog" aria-modal="true" aria-label="찍은 사진" hidden>
  <div id="resultBg"></div>
  <div id="photoBox"><img id="shot" alt="방금 찍은 사진"></div>
  <div id="actions" class="glass">
    <button class="big primary press" id="save" type="button">사진 저장하기</button>
    <button class="quiet press" id="back" type="button">돌아가기</button>
  </div>
</div>

<video id="video" playsinline muted autoplay></video>
<input type="file" id="file" accept="image/*" tabindex="-1" aria-hidden="true">

<script src="films.js"></script>
<script type="module" src="app.js"></script>
<!-- 아주 오래된 브라우저는 위 파일을 읽지 못한다. 그때는 이유를 알려 준다 -->
<script nomodule>document.getElementById('err').textContent = '이 브라우저에서는 쓸 수 없어요. 사파리를 최신 버전으로 업데이트해 주세요.';</script>
</body>
</html>
