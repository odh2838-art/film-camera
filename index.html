<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 홈 화면 앱: 화면이 상태 표시줄 아래에서 시작하게 한다.
     black-translucent 로 두면 아이폰이 화면 높이를 상태 표시줄만큼 짧게 잡아서
     아래쪽이 잘리고 버튼을 눌러도 손가락 위치가 어긋났다. 바탕이 검정이라 겉보기는 같다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="optikē">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="application-name" content="optikē">
<title>optikē</title>
<style>
/* 모든 크기와 색은 여기 변수만 쓴다. 간격은 8의 배수, 글자는 3단계. */
:root{
  --s1:8px; --s2:16px; --s3:24px; --s4:32px;
  --r0:8px; --r1:16px; --r2:24px; --round:999px;
  --t1:13px; --t2:17px; --t3:34px;
  --tap:48px; --thumb:56px; --shutter:76px; --btn:56px;
  --dur:.25s; --ease:cubic-bezier(.2,.8,.2,1);
  --bg:#000; --ink:#fff; --sub:rgba(235,235,245,.6); --fill:rgba(118,118,128,.28);
  --glass:rgba(22,22,24,.62); --veil:rgba(0,0,0,.4); --accent:#ffd60a; --on-accent:#000;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t2);line-height:1.3;
  letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.press{transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.press:active{transform:scale(.96);opacity:.7}

/* 촬영 화면. 평소에는 사진을 가리는 것이 거의 없다.
   #top  가끔 쓰는 설정(사진 비율)      #view 사진이 될 화면. 셔터 줄 위 공간의 한가운데에 온다
   #dock 지금 필름을 알려 주는 작은 버튼. 누르면 필름 창이 열린다
   #band 필름 창. 열었을 때만 셔터 줄 위로 올라온다
   #bar  셔터 줄(항상 같은 자리)
   #view 의 위치와 높이는 layout() 이 사진 비율에 맞춰 정한다. */
#app{position:fixed;inset:0;overflow:hidden;padding-top:env(safe-area-inset-top)}
#view{position:absolute;left:0;right:0;overflow:hidden;background:var(--bg);touch-action:none;transition:top var(--dur) var(--ease),height var(--dur) var(--ease)}
#gl{width:100%;height:100%;object-fit:cover;display:block}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#stamp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;left:0;right:0;top:env(safe-area-inset-top);height:var(--tap);display:flex;align-items:center;justify-content:flex-end;padding:0 var(--s2);pointer-events:none}
#ratio{min-width:64px;height:var(--s4);padding:0 var(--s2);white-space:nowrap;overflow:visible;font-variant-numeric:tabular-nums;letter-spacing:0;border-radius:var(--round);font-size:var(--t1);font-weight:600;pointer-events:auto;position:relative}
#ratio::after{content:"";position:absolute;inset:calc(var(--s1) * -1)}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + var(--tap) + var(--s1));transform:translateX(-50%);width:max-content;max-width:calc(100% - var(--s4));padding:var(--s1) var(--s2);
  border-radius:var(--r1);font-size:var(--t1);font-weight:500;text-align:center;opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none}
#toast.show{opacity:1}

#dock{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#filmBtn{height:var(--s4);padding:0 var(--s2);border-radius:var(--round);font-size:var(--t1);font-weight:600;white-space:nowrap;pointer-events:auto;position:relative}
#filmBtn::after{content:"";position:absolute;inset:calc(var(--s1) * -1)}
/* 필름 창 바탕은 무채색. 뒤 사진 색이 번져 보이지 않게 채도를 올리지 않는다. */
#band{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:var(--s1);padding:var(--s1) 0;
  background:rgba(0,0,0,.64);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  visibility:hidden;opacity:0;transform:translateY(var(--s2));pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),visibility 0s var(--dur)}
#band.open{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition-delay:0s}
#done{position:absolute;top:0;right:var(--s1);min-width:var(--tap);height:var(--tap);padding:0 var(--s1);font-size:var(--t2);font-weight:600}
#label{text-align:center;padding:0 calc(var(--tap) + var(--s2))}
#filmName{font-size:var(--t2);font-weight:600}
#filmWhen{font-size:var(--t1);color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#filmsWrap{position:relative}
#films{display:flex;gap:var(--s1);overflow-x:auto;scroll-snap-type:x mandatory;position:relative;
  padding:var(--s1) calc(50% - var(--thumb) / 2);scrollbar-width:none;touch-action:pan-x}
#films::-webkit-scrollbar{display:none}
/* 네모는 사진, 동그라미는 버튼 */
.film{flex:0 0 var(--thumb);height:var(--thumb);border-radius:var(--r0);overflow:hidden;background:var(--fill);scroll-snap-align:center;will-change:transform,opacity}
.film canvas{width:100%;height:100%;display:block}
#ring{position:absolute;left:50%;top:50%;width:calc(var(--thumb) + var(--s1));height:calc(var(--thumb) + var(--s1));
  transform:translate(-50%,-50%);border-radius:calc(var(--r0) + 4px);border:2px solid var(--accent);pointer-events:none}
/* 강도 다이얼: 카메라 링처럼 눈금이 둥글게 돈다. 노란 선이 지금 강도다. */
#dial{display:block;width:100%;height:56px;touch-action:none;cursor:grab}
#dial:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r1)}

#bar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;background:var(--veil);
  padding:var(--s2) var(--s4) calc(var(--s2) + env(safe-area-inset-bottom))}
.side{display:flex;flex-direction:column;align-items:center;gap:var(--s1);width:var(--shutter);margin-top:calc((var(--shutter) - var(--tap)) / 2);font-size:var(--t1);color:var(--ink);white-space:nowrap}
.side .ic{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink)}
.side svg{width:24px;height:24px}
#pick{justify-self:start}
#flip{justify-self:end}
#shutter{width:var(--shutter);height:var(--shutter);border-radius:50%;border:4px solid var(--ink);padding:3px}
#shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--ink);transition:transform var(--dur) var(--ease)}
#shutter:active span{transform:scale(.88)}

/* 시작 화면 */
#start{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;gap:var(--s1);
  padding:var(--s4) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom))}
#start .copy{margin:auto 0;text-align:center}
#start h1{font-size:var(--t3);font-weight:700;line-height:1.2;margin:0 0 var(--s1);letter-spacing:-0.025em}
#start p{margin:0;font-size:var(--t2);color:var(--sub);line-height:1.5}
#start #err{color:var(--ink);font-size:var(--t1);text-align:center;margin-bottom:var(--s1)}
#err:empty{display:none}
.big{width:100%;min-height:var(--btn);padding:var(--s2);border-radius:var(--r1);font-size:var(--t2);font-weight:600}
.primary{background:var(--accent);color:var(--on-accent)}
.quiet{min-height:var(--tap);font-size:var(--t2);font-weight:400;color:var(--ink)}

/* 결과 화면: 사진은 뷰파인더가 있던 바로 그 자리에 놓인다 */
#result{position:fixed;inset:0;z-index:20}
#resultBg{position:absolute;inset:0;background:var(--bg)}
#photoBox{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center}
#shot{display:block;max-width:100%;max-height:100%;transform-origin:center}
#actions{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:var(--s1);
  padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom));border-radius:var(--r2) var(--r2) 0 0}

input[type=file]{display:none}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:0s!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="gl"></canvas>
    <canvas id="stamp" hidden></canvas>
    <div id="flash"></div>
  </div>
  <div id="top">
    <button id="ratio" class="glass press" aria-label="사진 비율 바꾸기"></button>
  </div>
  <div id="toast" class="glass" role="status" aria-live="polite"></div>
  <div id="dock">
    <button id="filmBtn" class="glass press" aria-label="필름 고르기 열기"></button>
  </div>
  <div id="band">
    <button id="done" class="press">완료</button>
    <div id="label" aria-live="polite">
      <div id="filmName"></div>
      <div id="filmWhen"></div>
    </div>
    <canvas id="dial" role="slider" tabindex="0" aria-label="필름 강도. 좌우로 돌려서 바꿔요" aria-valuemin="0" aria-valuemax="100"></canvas>
    <div id="filmsWrap">
      <div id="films" role="group" aria-label="필름 고르기. 좌우로 밀어서 바꿔요"></div>
      <div id="ring"></div>
    </div>
  </div>
  <div id="bar">
    <button class="side press" id="pick" aria-label="앨범에서 사진 고르기">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></span>
      <span aria-hidden="true">앨범</span>
    </button>
    <button id="shutter" aria-label="사진 찍기"><span></span></button>
    <button class="side press" id="flip" aria-label="앞뒤 카메라 바꾸기">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0114-3l2 2M20 15a8 8 0 01-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></span>
      <span aria-hidden="true">앞뒤 바꾸기</span>
    </button>
  </div>
</div>

<div id="start">
  <div class="copy">
    <h1 lang="grc-Latn">optikē</h1>
    <p>필름을 고르고 찍기만 하면 돼요.</p>
  </div>
  <p id="err" role="alert"></p>
  <button class="big primary press" id="go">카메라 켜기</button>
  <button class="quiet press" id="go2">앨범 사진으로 해볼게요</button>
</div>

<div id="result" hidden>
  <div id="resultBg"></div>
  <div id="photoBox"><img id="shot" alt="방금 찍은 사진"></div>
  <div id="actions" class="glass">
    <button class="big primary press" id="save">사진 저장하기</button>
    <button class="quiet press" id="back">돌아가기</button>
  </div>
</div>

<video id="video" playsinline muted autoplay style="display:none"></video>
<input type="file" id="file" accept="image/*">

<script src="films.js"></script>
<script>
const $ = id => document.getElementById(id);
const app = $('app'), canvas = $('gl'), video = $('video'), view = $('view'), filmsEl = $('films');
const motionOff = matchMedia('(prefers-reduced-motion: reduce)');
const DUR = 300, EASE = 'cubic-bezier(.2,.8,.2,1)';

const VS = `attribute vec2 p;varying vec2 v;uniform float uMirror;
void main(){v=p*.5+.5;if(uMirror>.5)v.x=1.-v.x;gl_Position=vec4(p,0.,1.);}`;
const FS = `precision highp float;
varying vec2 v;uniform sampler2D uTex;uniform vec2 uRes;uniform float uTime;
uniform float uEv,uCf,uHi,uSh,uGs,uGrain,uVig,uStr,uSS,uHS,uPix,uLev,uBlur,uChroma,uScan,uFlash;
uniform vec3 uWb,uSC,uHC;uniform vec3 uBands[7];uniform float uCurve[5];
float cv(float x){x=clamp(x,0.,1.);
  if(x<.25)return mix(uCurve[0],uCurve[1],x*4.);
  if(x<.5)return mix(uCurve[1],uCurve[2],(x-.25)*4.);
  if(x<.75)return mix(uCurve[2],uCurve[3],(x-.5)*4.);
  return mix(uCurve[3],uCurve[4],(x-.75)*4.);}
vec3 rgb2hsl(vec3 c){float mx=max(c.r,max(c.g,c.b)),mn=min(c.r,min(c.g,c.b)),l=(mx+mn)*.5,d=mx-mn,h=0.,s=0.;
  if(d>1e-5){s=l>.5?d/(2.-mx-mn):d/(mx+mn);
    if(mx==c.r)h=(c.g-c.b)/d+(c.g<c.b?6.:0.);else if(mx==c.g)h=(c.b-c.r)/d+2.;else h=(c.r-c.g)/d+4.;h*=60.;}
  return vec3(h,s,l);}
vec3 hsl2rgb(vec3 k){float h=mod(k.x,360.)/60.,c=(1.-abs(2.*k.z-1.))*k.y,x=c*(1.-abs(mod(h,2.)-1.)),m=k.z-c*.5;vec3 r;
  if(h<1.)r=vec3(c,x,0.);else if(h<2.)r=vec3(x,c,0.);else if(h<3.)r=vec3(0.,c,x);else if(h<4.)r=vec3(0.,x,c);else if(h<5.)r=vec3(x,0.,c);else r=vec3(c,0.,x);
  return r+m;}
float bw(float h,float lo,float c,float hi){return h<c?clamp((h-lo)/(c-lo),0.,1.):clamp((hi-h)/(hi-c),0.,1.);}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  vec2 uv=v;
  if(uPix>0.){vec2 n=uPix*uRes/min(uRes.x,uRes.y);uv=(floor(v*n)+.5)/n;}
  vec3 o=texture2D(uTex,uv).rgb;
  vec3 c=o;
  if(uBlur>0.){vec2 d=vec2(uBlur,0.);
    c=(texture2D(uTex,uv-2.*d).rgb+texture2D(uTex,uv-d).rgb+o+texture2D(uTex,uv+d).rgb+texture2D(uTex,uv+2.*d).rgb)/5.;}
  if(uChroma>0.){vec2 d=vec2(uChroma,0.),e=vec2(uBlur,0.);
    c.r=(texture2D(uTex,uv+d-e).r+texture2D(uTex,uv+d).r+texture2D(uTex,uv+d+e).r)/3.;
    c.b=(texture2D(uTex,uv-d-e).b+texture2D(uTex,uv-d).b+texture2D(uTex,uv-d+e).b)/3.;}
  c=c*uEv*uWb;
  c=(c-.5)*uCf+.5;
  float L=clamp(dot(c,vec3(.299,.587,.114)),0.,1.);
  c+=uHi*smoothstep(.5,1.,L)+uSh*(1.-smoothstep(0.,.5,L));
  c=vec3(cv(c.r),cv(c.g),cv(c.b));
  vec3 k=rgb2hsl(c);float h=k.x;
  vec3 a=uBands[0]*max(bw(h,-60.,0.,30.),bw(h-360.,-60.,0.,30.))
    +uBands[1]*bw(h,0.,30.,60.)+uBands[2]*bw(h,30.,60.,120.)+uBands[3]*bw(h,60.,120.,180.)
    +uBands[4]*bw(h,120.,180.,240.)+uBands[5]*bw(h,180.,240.,300.)+uBands[6]*bw(h,240.,300.,360.);
  k.x+=a.x;
  k.y=clamp(k.y*(1.+a.y/100.)*uGs,0.,1.);
  k.z=clamp(k.z+a.z/100.*.3*k.y,0.,1.);
  c=hsl2rgb(k);float l=k.z;
  c+=(uSC-.5)*(1.-l)*(1.-l)*uSS+(uHC-.5)*l*l*uHS;
  c+=(hash(uv*uRes+uTime)-.5)*uGrain*(1.-abs(2.*l-1.)*.6);
  vec2 d=uv-.5;c*=1.+uVig*dot(d,d)*2.;
  if(uFlash>0.){float fr=length(d*vec2(uRes.x/uRes.y,1.));c*=1.+uFlash*(1.-smoothstep(0.,.7,fr));}
  if(uLev>1.5)c=floor(clamp(c,0.,1.)*(uLev-1.)+.5)/(uLev-1.);
  if(uScan>0.){float per=max(2.,min(uRes.x,uRes.y)/240.);c*=1.-uScan*(.5+.5*cos(6.2831853*gl_FragCoord.y/per));}
  gl_FragColor=vec4(mix(o,clamp(c,0.,1.),uStr),1.);
}`;

// 같은 셰이더로 그리는 WebGL 화면을 만든다. 큰 화면과 필름 미리보기가 하나씩 쓴다.
function createRenderer(cv) {
  const g = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
  if (!g) throw new Error('WebGL을 쓸 수 없어요');
  const compile = (type, src) => {
    const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s);
    if (!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s));
    return s;
  };
  const prog = g.createProgram();
  g.attachShader(prog, compile(g.VERTEX_SHADER, VS));
  g.attachShader(prog, compile(g.FRAGMENT_SHADER, FS));
  g.linkProgram(prog);
  if (!g.getProgramParameter(prog, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(prog));
  g.useProgram(prog);
  g.bindBuffer(g.ARRAY_BUFFER, g.createBuffer());
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(prog, 'p');
  g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
  g.bindTexture(g.TEXTURE_2D, g.createTexture());
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
  g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL, true);
  const u = {};
  for (const n of ['uMirror','uRes','uTime','uEv','uCf','uHi','uSh','uGs','uGrain','uVig','uStr','uSS','uHS','uPix','uLev','uBlur','uChroma','uScan','uFlash','uWb','uSC','uHC','uBands','uCurve'])
    u[n] = g.getUniformLocation(prog, n);
  return { g, u };
}

function hue2rgb(h) {
  h = ((h % 360) + 360) % 360 / 60; const x = 1 - Math.abs(h % 2 - 1);
  return h < 1 ? [1,x,0] : h < 2 ? [x,1,0] : h < 3 ? [0,1,x] : h < 4 ? [0,x,1] : h < 5 ? [x,0,1] : [1,0,x];
}
// 필름 강도. 사용자가 밀어서 정한 값(0~100)을 필름마다 기억한다.
// 처음 값은 films.js 의 amount, 없으면 100.
let amounts = {};
try { amounts = JSON.parse(localStorage.getItem('amounts')) || {}; } catch (e) {}
function amountOf(f) {
  if (f && f.fixed) return 1;   // 강도 조절이 없는 필름은 항상 최대
  const v = f && f.id && amounts[f.id] != null ? amounts[f.id] : (f && f.amount != null ? f.amount : 100);
  return Math.max(0, Math.min(100, v)) / 100;
}

// 필름 숫자를 셰이더 값으로 바꾸는 곳. 계산식을 바꾸면 모든 필름의 느낌이 같이 바뀐다.
// gl, U 는 어느 화면(큰 화면 / 미리보기)에 적용할지다. 계산은 같다.

  gl.uniform1f(U.uGs, 1 + f.saturation / 100);

  gl.uniform3fv(U.uBands, new Float32Array([].concat(h.red, h.orange, h.yellow, h.green, h.cyan, h.blue, h.magenta)));
  gl.uniform1fv(U.uCurve, new Float32Array(f.curve));

  gl.uniform3fv(U.uHC, hue2rgb(f.splitTone.highlight[0]));
  gl.uniform1f(U.uSS, f.splitTone.shadow[1] / 100 * 0.5);
  gl.uniform1f(U.uHS, f.splitTone.highlight[1] / 100 * 0.5);
  gl.uniform1f(U.uGrain, f.grain / 100 * 0.35);
  gl.uniform1f(U.uVig, f.vignette / 100 * 0.8);

  gl.uniform1f(U.uFlash, (f.flash || 0) / 100 * 0.45 * a);

// 필름이 하나도 없을 때 쓰는 값. 원본 그대로 보인다.
const NO_FILM = {

  hsl: { red: [0,0,0], orange: [0,0,0], yellow: [0,0,0], green: [0,0,0], cyan: [0,0,0], blue: [0,0,0], magenta: [0,0,0] },

/* 사진 비율. 기본 카메라와 같은 세 가지다.

const RATIOS = {

  '1:1':  { h: 1,      wide: false, say: '정사각형이에요. 프로필 사진이나 SNS에 좋아요.' },

   필름 창이 열려 있으면 뷰파인더를 맨 위로 올려서 창이 사진을 덜 가리게 한다.
   그 공간보다 긴 비율(16:9)은 화면 전체의 가운데에 놓고, 셔터 줄이 그 위에 반투명하게 얹힌다. */

/* 필름 창: 필름 버튼을 누르면 열리고, 완료나 사진을 누르면 닫힌다 */

  if (stream && RATIOS[before].wide !== RATIOS[r].wide) {
    try { await ensureCamera(true); } catch (e) { if (!e || e.name !== 'Stale') toast('카메라를 다시 켜지 못했어요. 잠시 뒤 다시 눌러 주세요.'); }

/* 큰 화면: 매 프레임 그린다 */

}

/* 필름 미리보기: 작게 줄인 화면 한 장에 모든 필름을 나란히 그리고, 1초에 4번만 새로 그린다 */
const T = 120, THUMB_EVERY = 250;

  const small = document.createElement('canvas'); small.width = small.height = T;

function loop(now) {

/* 필름 고르기: 가운데 온 필름이 바로 선택된다 */
const items = [];
function setFilm(f) {
  if (film === f && $('filmName').textContent) return;
  film = f; applyFilm(f);
  $('filmName').textContent = f.name; $('filmWhen').textContent = f.when;
  $('filmBtn').textContent = '필름 · ' + f.name;
  $('label').animate(motionOff.matches ? [{ opacity: 0 }, { opacity: 1 }]
    : [{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: EASE });

/* 날짜 도장: 캠코더처럼 오른쪽 아래에 주황빛 디지털 글씨로 날짜와 시간을 찍는다.
   화면(미리보기)과 저장한 사진에 같은 크기, 같은 자리로 들어간다. 필름의 stamp: 'date' 로 켠다. */
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
function stampOn() { return !!(film && film.stamp === 'date' && amountOf(film) >= 0.2); }
function drawStamp(ctx, W, H) {

  // 작은 캔버스에 8px 글씨로 쓴 뒤 계단지게 키워서 옛날 디지털 글씨처럼 만든다

  const r = devicePixelRatio || 1;
  const w = Math.round((parseFloat(view.style.width) || view.clientWidth) * r);
  const h = Math.round((parseFloat(view.style.height) || view.clientHeight) * r);

setInterval(updateStamp, 15000);

/* 강도 다이얼: 눈금을 좌우로 돌리면 바로 화면에 보인다.
   왼쪽으로 돌리면(손가락을 왼쪽으로) 강해지고, 오른쪽으로 돌리면 약해진다. 손을 튕기면 조금 더 돌다 멈춘다. */
const dial = $('dial'), dctx = dial.getContext('2d');
const PPU = 6;                 // 강도 1 = 화면 6px

function sizeDial() {

addEventListener('resize', sizeDial);
function buildFilms() {
  FILMS.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'film'; b.dataset.i = i; b.setAttribute('aria-label', f.name + '. ' + f.when);
    const c = document.createElement('canvas'); c.width = c.height = T;

// 다이얼처럼: 가운데에 가까울수록 크고 또렷하게 보인다
function updateDial() {

  items.forEach(b => {

// 화면을 좌우로 쓸어도 옆 필름으로 넘어간다
let sx = 0, sy = 0;
view.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
view.addEventListener('pointerup', e => {
  const dx = e.clientX - sx, dy = e.clientY - sy;

/* 카메라와 앨범 */
// 카메라를 켤 때마다 번호를 하나씩 올린다. 늦게 도착한 예전 요청은 번호가 달라서 버린다.

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'NoCamera' };
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const wide = RATIOS[ratio].wide;
  const s = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: facing }, aspectRatio: { ideal: wide ? 16 / 9 : 4 / 3 }, width: { ideal: 1920 }, height: { ideal: wide ? 1080 : 1440 } }
  });
  if (my !== camGen) { s.getTracks().forEach(t => t.stop()); throw { name: 'Stale' }; }
  if (document.hidden) { s.getTracks().forEach(t => t.stop()); cameraWanted = true; throw { name: 'Stale' }; }
  stream = s; video.srcObject = s;
  try { await video.play(); }
  catch (e) { if (my !== camGen) throw { name: 'Stale' }; throw { name: 'PlayBlocked' }; }
  if (my !== camGen) throw { name: 'Stale' };
  source = video; canvas.style.objectFit = 'cover';
  cameraWanted = true;
  try { localStorage.setItem('camera', 'on'); } catch (e) {}
  // 다른 앱이 카메라를 가져가거나 전화가 오면 영상이 끊긴다. 화면이 보이는 중이면 다시 켠다.
  const track = stream.getVideoTracks()[0];
  if (track) track.addEventListener('ended', () => { if (!document.hidden) resumeCamera(); });
  layout();
}

/* 카메라 이어서 켜기.
   - 앱을 나갔다 돌아오면(홈 화면 앱 포함) 카메라 영상이 멈춰 있으므로 다시 켠다.
   - 나갈 때는 카메라를 꺼서 초록 불(카메라 사용 중 표시)이 남지 않게 한다.
   - 한 번 카메라를 켠 적이 있으면 다음에 열 때 시작 화면 없이 바로 켠다. */
let cameraWanted = false, starting = null;
// fresh 가 참이면(사용자가 버튼을 눌렀을 때) 하던 요청을 버리고 새로 켠다.
// 아이폰은 앱을 막 열었을 때 버튼을 누르기 전의 카메라 요청에 답하지 않고 멈춰 있을 때가 있다.
function ensureCamera(fresh) {
  if (fresh || !starting) {
    const p = startCamera().finally(() => { if (starting === p) starting = null; });
    starting = p;
  }
  return starting;
}
function showStart(msg) {
  const s = $('start');
  s.getAnimations().forEach(a => a.cancel());
  s.style.opacity = '';
  s.hidden = false; $('err').textContent = msg || '';
}
// 시작 화면 없이 켜 보고, 잠깐 기다려도 안 켜지면 시작 화면을 보여 줘서 버튼으로 다시 켤 수 있게 한다
function autoCamera() {
  if (document.hidden) return;
  $('start').hidden = true;
  const fallback = setTimeout(() => { if (!stream) showStart(''); }, 2500);
  ensureCamera().then(() => { clearTimeout(fallback); hideStart(); }, e => {
    clearTimeout(fallback);
    if (e && e.name === 'Stale') return;
    if (e && e.name === 'NotAllowedError') { try { localStorage.removeItem('camera'); } catch (x) {} }
    showStart(e && (e.name === 'NotAllowedError' || e.name === 'NoCamera') ? cameraError(e) : '');
  });
}
async function resumeCamera() {
  if (!cameraWanted || document.hidden) return;
  const track = stream && stream.getVideoTracks()[0];
  if (track && track.readyState === 'live') { try { await video.play(); return; } catch (e) {} }
  autoCamera();
}
function pauseCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseCamera(); return; }
  scrollTo(0, 0); layout();   // 돌아왔을 때 화면이 밀려 있으면 제자리로
  resumeCamera();
});
addEventListener('pageshow', e => { if (e.persisted) resumeCamera(); });
video.addEventListener('pause', () => { if (cameraWanted && !document.hidden && stream) video.play().catch(() => {}); });
// 홈 화면에 추가한 앱으로 열었는지 (주소창이 없다)
function isHomeApp() { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; }
function cameraError(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError') return isHomeApp()
    ? '카메라를 쓸 수 있게 허락해 주세요. 아이폰 설정의 Safari → 카메라에서 "허용"으로 바꿀 수 있어요.'
    : '카메라를 쓸 수 있게 허락해 주세요. 주소창 왼쪽 "가가" → 웹 사이트 설정 → 카메라에서 바꿀 수 있어요.';
  if (n === 'NoCamera') return '이 주소에서는 카메라를 켤 수 없어요. https로 시작하는 주소로 열어 주세요.';
  return '카메라를 켜지 못했어요. 카메라를 쓰는 다른 앱을 닫고 다시 눌러 주세요. 앨범 사진으로도 해볼 수 있어요.'
    + (n ? ` (${n})` : '');
}
function hideStart() {
  const s = $('start');
  if (s.hidden) return;
  s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: DUR, easing: EASE }).onfinish = () => { s.hidden = true; };
}
function useImage(file) {
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    cameraWanted = false;
    source = c; canvas.style.objectFit = 'contain';
    layout();
    if (trayOpen) drawThumbs();
    hideStart();
  };
  img.onerror = () => {
    const msg = '이 사진은 열지 못했어요. 다른 사진을 골라 주세요.';
    if ($('start').hidden) toast(msg); else $('err').textContent = msg;
  };
  img.src = URL.createObjectURL(file);
}

$('go').onclick = async () => {
  $('err').textContent = '';
  try { await ensureCamera(true); hideStart(); }
  catch (e) { if (!e || e.name !== 'Stale') $('err').textContent = cameraError(e); }
};
$('go2').onclick = $('pick').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) useImage(e.target.files[0]); e.target.value = ''; };
$('flip').onclick = async () => {
  const before = facing;
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await ensureCamera(true); }
  catch (e) { if (e && e.name === 'Stale') return; facing = before; toast('카메라를 바꾸지 못했어요. 잠시 뒤 다시 눌러 주세요.'); }
};

/* 찍기: 뷰파인더에 보이는 그대로 저장한다 */
function visibleCrop() {
  const r = canvas.getBoundingClientRect(), w = canvas.width, h = canvas.height;
  const cover = canvas.style.objectFit !== 'contain';
  const s = cover ? Math.max(r.width / w, r.height / h) : Math.min(r.width / w, r.height / h);
  const cw = Math.round(Math.min(w, r.width / s)), ch = Math.round(Math.min(h, r.height / s));
  const out = document.createElement('canvas'); out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(canvas, Math.round((w - cw) / 2), Math.round((h - ch) / 2), cw, ch, 0, 0, cw, ch);
  return out;
}
$('shutter').onclick = () => {
  if (busy || !ready()) return;
  // 카메라를 다시 켜는 중이면(비율을 바꾼 직전 등) 찍지 않는다
  if (source === video && !(stream && stream.getVideoTracks()[0] && stream.getVideoTracks()[0].readyState === 'live')) return;
  busy = true;
  draw();
  const out = visibleCrop();
  if (stampOn()) drawStamp(out.getContext('2d'), out.width, out.height);
  $('flash').animate([{ opacity: .9 }, { opacity: 0 }], { duration: 200, easing: 'ease-out' });
  out.toBlob(blob => {
    if (!blob) { busy = false; toast('사진을 만들지 못했어요. 한 번 더 눌러 주세요.'); return; }
    lastBlob = blob; openResult(blob);
  }, 'image/jpeg', 0.92);
};

/* 결과 화면: 사진은 뷰파인더 자리에 그대로 멈추고, 버튼이 아래에서 올라온다 */
function growFrom() {
  const a = view.getBoundingClientRect(), b = $('shot').getBoundingClientRect();
  if (!b.width) return 'none';
  const k = Math.min(a.width / b.width, a.height / b.height);
  return `translate(${a.left + a.width / 2 - (b.left + b.width / 2)}px, ${a.top + a.height / 2 - (b.top + b.height / 2)}px) scale(${k})`;
}
function playResult(forward) {
  const img = $('shot'), o = { duration: motionOff.matches ? 200 : DUR, easing: EASE, fill: 'both', direction: forward ? 'normal' : 'reverse' };
  const anims = [
    $('resultBg').animate([{ opacity: 0 }, { opacity: 1 }], o),
    $('actions').animate(motionOff.matches ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ opacity: 0, transform: 'translateY(32px)' }, { opacity: 1, transform: 'none' }], o),
    img.animate(motionOff.matches ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ transform: growFrom() }, { transform: 'none' }], o)
  ];
  return Promise.all(anims.map(a => a.finished));
}
async function openResult(blob) {
  const img = $('shot'), r = view.getBoundingClientRect(), box = $('photoBox');
  box.style.top = r.top + 'px'; box.style.height = r.height + 'px';
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(blob);
  try { await img.decode(); } catch (e) {}
  $('result').hidden = false;
  await playResult(true);
  busy = false;
}
$('back').onclick = async () => {
  if (busy) return;
  busy = true;
  await playResult(false);
  $('result').hidden = true;
  busy = false;
};
$('save').onclick = async () => {
  if (!lastBlob) return;
  const name = 'film-' + Date.now() + '.jpg';
  const file = new File([lastBlob], name, { type: 'image/jpeg' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = $('shot').src; a.download = name; a.click();
};

try {
  main = createRenderer(canvas);
  initThumbs(); buildFilms();
  let saved = null, savedRatio = null;
  try { saved = localStorage.getItem('film'); savedRatio = localStorage.getItem('ratio'); } catch (e) {}
  const i = FILMS.findIndex(f => f.id === saved);
  setRatio(RATIOS[savedRatio] ? savedRatio : '4:3', false);
  if (!FILMS.length) { applyFilm(NO_FILM); $('dock').hidden = true; }
  requestAnimationFrame(() => { layout(); goToFilm(i >= 0 ? i : 0, false); });
  requestAnimationFrame(loop);
  // 전에 카메라를 켠 적이 있으면 시작 화면 없이 바로 켠다
  let wasOn = false; try { wasOn = localStorage.getItem('camera') === 'on'; } catch (e) {}
  if (wasOn) { cameraWanted = true; autoCamera(); }
} catch (e) {
  $('err').textContent = '이 브라우저에서는 필름 효과를 쓸 수 없어요. 사파리를 최신 버전으로 업데이트해 주세요.';
}
// 새로 올린 필름과 화면이 바로 보이게 한다 (sw.js 참고)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
